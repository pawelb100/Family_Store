plugins {
    id 'com.android.application'
    id 'com.google.gms.google-services'
}

Properties localProperties = new Properties()
localProperties.load(project.rootProject.file('local.properties').newDataInputStream())

android {
    signingConfigs {
        debug {
            def debugKeystorePath = localProperties.getProperty('debug.keystore.file')
            if (debugKeystorePath != null) {
                storeFile file(debugKeystorePath)
            }
        }

        release {
            storeFile file(localProperties.getProperty('release.keystore.file'))
            storePassword localProperties.getProperty('release.keystore.password')
            keyAlias localProperties.getProperty('release.key.alias')
            keyPassword localProperties.getProperty('release.key.password')
        }
    }
    namespace 'com.familystore.familystore'
    compileSdk 35

    defaultConfig {
        applicationId 'com.familystore.familystore'
        minSdk 29
        targetSdk 33
        versionCode 1
        versionName '3.2.6'  // last changed: 14/02/2026
        base {
            archivesName = 'fs-' + versionName
        }

        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'

        def requiredLocalProperties = [
                'SUPABASE_URL'            : 'supabase.url',
                'SUPABASE_PUBLISHABLE_KEY': 'supabase.publishable.key',
                'ONESIGNAL_APP_ID'        : 'onesignal.appid',
        ]
        requiredLocalProperties.each { buildConfigFieldName, localPropertyId ->
            def propertyValue = localProperties.getProperty(localPropertyId)
            if (propertyValue == null) {
                throw new RuntimeException(
                        "Missing required field from localProperties: ${localPropertyId}"
                )
            }
            buildConfigField('String', buildConfigFieldName, "\"$propertyValue\"")
        }
    }

    buildFeatures {
        viewBinding true
        buildConfig true
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            manifestPlaceholders = [appName: "Family Store"]
        }
        debug {
            signingConfig signingConfigs.debug
            applicationIdSuffix '.debug'
            versionNameSuffix '-debug'
            manifestPlaceholders = [appName: "Family Store Debug"]
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {

    //Project initialized
    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.1'
    implementation 'androidx.preference:preference:1.2.1'
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.3.0'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.7.0'

    //Lombok
    compileOnly 'org.projectlombok:lombok:1.18.42'
    annotationProcessor 'org.projectlombok:lombok:1.18.42'

    //Retrofit (HTTP client)
    implementation 'com.squareup.retrofit2:retrofit:3.0.0'
    implementation 'com.squareup.retrofit2:converter-gson:3.0.0'

    //JSONSerializer
    implementation 'com.google.code.gson:gson:2.13.2'

    //NavigationComponent
    implementation fileTree(dir: 'libs', include: ['*.jar'])
    implementation 'androidx.navigation:navigation-fragment:2.9.7'
    implementation 'androidx.navigation:navigation-ui:2.9.7'

    //sharedViewModel
    implementation 'androidx.lifecycle:lifecycle-extensions:2.2.0'

    //Picasso
    implementation 'com.squareup.picasso:picasso:2.8'

    //OneSignal
    implementation 'com.onesignal:OneSignal:4.8.12'

}