# Credit: https://dev.to/ronynn/automating-android-apk-builds-with-github-actions-the-sane-way-1h95
name: New release

on:
  push:
    branches: [ main ]

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v5
        with:
          distribution: 'microsoft'
          java-version: '17'

      - name: Decode keystore and put it into a file
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > app/keystore.jks

      - name: Create local.properties
        run: |
          echo "release.keystore.file=keystore.jks" >> local.properties
          echo "release.keystore.password=${{ secrets.KEYSTORE_PASSWORD }}" >> local.properties
          echo "release.key.alias=${{ secrets.KEY_ALIAS }}" >> local.properties
          echo "release.key.password=${{ secrets.KEY_PASSWORD }}" >> local.properties
          echo "onesignal.appid=${{ vars.ONESIGNAL_APP_ID }}" >> local.properties
          echo "supabase.url=${{ vars.SUPABASE_URL }}" >> local.properties
          echo "supabase.publishable.key=${{ vars.SUPABASE_PUBLISHABLE_KEY }}" >> local.properties

      - name: Setup Gradle cache
        uses: gradle/actions/setup-gradle@v5

      - name: Build release APK
        run: ./gradlew assembleRelease

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: apk-release
          path: app/build/outputs/apk/release/*.apk
