name: Checks

on:
  pull_request:
    branches: [ master, dev ]

jobs:
  check:
    name: Run gradle checks
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v5
        with:
          distribution: 'microsoft'
          java-version: '17'

      - name: Create dummy local.properties
        run: |
          echo "release.keystore.file=dummy" >> local.properties
          echo "release.keystore.password=" >> local.properties
          echo "release.key.alias=" >> local.properties
          echo "release.key.password=" >> local.properties
          echo "onesignal.appid=" >> local.properties
          echo "supabase.url=" >> local.properties
          echo "supabase.publishable.key=" >> local.properties

      - name: Setup Gradle cache
        uses: gradle/actions/setup-gradle@v5

      - name: Run gradle checks
        run: ./gradlew check
